# Nitpick PR review, INLINED.
#
# Upstream is queso/nitpick-flow/.github/workflows/nitpick.yml, which this repo cannot call
# as a reusable workflow: nitpick-flow is private, this repo is public, and GitHub refuses
# that combination ("workflow was not found") regardless of the Actions access level. So the
# body is copied here instead.
#
# ==> THIS IS A COPY. Changes to the upstream workflow do not reach this file. When Nitpick
#     changes, re-sync from nitpick-flow@main and bump FLOW_IMAGE below. Incident history,
#     model A/B results and the tests that pin the marked regions below (diff-fetch,
#     diff-valve, nitpickignore-fetch, retry-loop) all live in that private repo. Paths such
#     as flow.yaml and src/*.mjs refer to nitpick-flow; they are baked into the image at /flow.
#
# Inlining substitutions vs upstream: the workflow_call inputs are hardcoded (flow image,
# both model seats, gateway base URL), conduit_api_key reads FIREWORKS_AI_API_KEY directly,
# registry_token collapses to GITHUB_TOKEN, and the job gained a fork guard and a
# per-PR concurrency group.
#
# Setup this file depends on, neither of which lives in the repo:
#   1. Repo secret FIREWORKS_AI_API_KEY (the model gateway key).
#   2. GHCR read grant: the private ghcr.io/queso/nitpick-flow package must grant this repo
#      Read under Package settings -> Manage Actions access. There is no REST API for it.
#      Without it the run dies in ~12s at "Run Nitpick flow" with
#      `docker: Error response from daemon: denied`.
#
# Per-repo configuration:
#   .nitpickignore  gitignore-style globs at the repo root; matching files are listed in the
#                   reviewers' manifest but their diff is not reviewed. Read from the PR's BASE
#                   commit, so a PR cannot exclude its own code.
# Reviewer context: CLAUDE.md plus every AGENTS.md within three levels is concatenated into
# the shared prompt prefix, so this repo's conventions ride every shard.
# A PR whose projected token spend is over the flow's 4M-token runaway guard is stopped
# before any model call, and the reason is posted as a PR comment.
#
# Trust model: the PR diff is author-controlled input to the model, and the posted review
# (including the blocking verdict) is model output derived from it. Treat review text as
# untrusted automation, not a human sign-off, and do not make this check the only barrier
# for sensitive changes. A prompt injection in the diff can steer both the comments and
# the verdict; the fork guard limits who can trigger it, not what it can say.
name: Nitpick PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# A new push to the same PR supersedes the in-flight review.
concurrency:
  group: nitpick-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The flow image runs the whole pipeline and receives the gateway key, so it is pinned by
  # content digest, not the `:main` tag (a moving pointer the publisher can re-push, invisible
  # in any diff here). Bump this deliberately when re-syncing from upstream:
  #   gh api /user/packages/container/nitpick-flow/versions \
  #     --jq '.[] | select(.metadata.container.tags | index("main")) | .name'
  # Digest below = nitpick-flow sha-4f588cd (pushed 2026-10-11).
  FLOW_IMAGE: ghcr.io/queso/nitpick-flow@sha256:01f24f78277e68558260247e77e1fb1df94809e9c6229bab557e88d1804fe9a2

jobs:
  review:
    # Fork PRs are skipped: this repo is public and GitHub withholds secrets from
    # fork-originated pull_request runs, so FIREWORKS_AI_API_KEY would arrive empty and
    # the job would fail instead of reviewing anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PR diff + context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The one-shot diff media type hard-fails past 20,000 lines ("diff too_large") on very
          # large PRs. Fall back to reconstructing a reviewable patch
          # from the paginated per-file entries; files whose own patch GitHub also withholds
          # (binaries, generated giants) are listed by name so reviewers know they exist.
          PR="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          # diff-fetch:begin — sliced verbatim by nitpick-flow's .github/scripts/diff-fetch.test.mjs, which
          # runs this exact text under `bash -e` (the Actions default shell) with a stubbed `gh` on PATH
          # and `PR` pre-set. Keep the region self-contained beyond that; move the markers if
          # its boundaries change.
          if ! gh api "$PR" -H "Accept: application/vnd.github.diff" > diff.patch 2>diff.err; then
            echo "one-shot diff unavailable ($(cat diff.err | head -c 200)); rebuilding per-file"
            # Fetch /files once: this path only runs on huge PRs, where rate-limit budget is
            # scarcest. files.jsonl holds one compact JSON object per line (`@json`); `jq -s`
            # slurps it back so the rebuild template stays `.[] | ...`, and the smoke check
            # below counts files from the same data.
            gh api --paginate "$PR/files" --jq '.[] | @json' > files.jsonl
            # .filename is PR-controlled and git allows raw control characters (including
            # newlines) in a path; the one-shot diff above is safe because git C-quotes such
            # names, but this template interpolates .filename as plain text, so a crafted
            # filename like "x\ndiff --git a/forged b/forged\n+injected" would otherwise
            # smuggle a forged header/content line into the diff fed to reviewer prompts.
            # Scrub control characters (0x00-0x1f, 0x7f) once and reuse the scrubbed name.
            jq -rs '.[] |
              (.filename | gsub("[\\x00-\\x1f\\x7f]"; "?")) as $f |
              "diff --git a/\($f) b/\($f)\n--- a/\($f)\n+++ b/\($f)\n" +
              (.patch // "@@ patch omitted by GitHub (\(.status), +\(.additions)/-\(.deletions)) @@")' \
              files.jsonl > diff.patch
            # Smoke-check the rebuild: the truncation valve below parses this output with
            # ^diff --git a\/(.+) b\// to bucket files. header_count and file_count are both
            # derived from files.jsonl now, so this no longer catches two fetches disagreeing
            # (there's only one) — it catches the jq template above regressing so it no longer
            # emits exactly one header per fetched file. Warn, don't fail; diff.patch may still
            # be reviewable even if the counts disagree.
            header_count=$(grep -c '^diff --git a/' diff.patch || true)
            file_count=$(wc -l < files.jsonl)
            if [ "$header_count" -ne "$file_count" ]; then
              echo "::warning::diff rebuild produced $header_count diff header(s) for $file_count changed file(s) — the truncation valve's file-boundary regex may disagree with the rebuild"
            fi
          fi
          # Guard the fallback's own failure mode: if the paginate rebuild also fails (rate
          # limit, transient 5xx) after the one-shot diff already failed, the redirect above
          # leaves diff.patch empty, this step still exits 0, and the flow posts a clean review
          # of nothing. Checked BEFORE `rm -f diff.err` so the one-shot failure reason is still
          # on disk for the error message below.
          [ -s diff.patch ] || { echo "::error::diff fetch failed; diff.patch is empty"; cat diff.err 2>/dev/null; exit 1; }
          rm -f diff.err files.jsonl
          # diff-fetch:end
          # SAFETY VALVE, applied to BOTH paths. Per-prompt sizing is no longer this cap's job:
          # the shard planner owns it — each reviewer child's prompt carries only its shard's
          # file-exact slice, so prompt size is bounded by the packer no matter how big the
          # total diff is. That's what retired the old 4000-line cap here, which the escape
          # pilot showed was the dominant escape mechanism (cap = coverage hole). This valve
          # only guards PATHOLOGICAL diffs (>60k lines) where even sharding + the flow's run
          # budgets (max_tokens andon, wall-clock) would be swamped. NB this valve counts
          # LINES and the budgets it protects are in TOKENS, so it is a loose proxy: real
          # diffs measure 45-51 bytes/line, which
          # puts 60k lines nearer 2.9 MB than the 800 KB this comment used to claim. A 956 KB
          # PR passes this valve untouched and still blows the token andon — the andon, not
          # this line count, is what actually stops an oversized PR. Beyond it:
          # keep whole files up to the budget, SOURCE files before tests, and close with an
          # explicit manifest of what was left out — a partial review with honest coverage
          # beats a dead job.
          #
          # Why per-prompt size matters (measured direct against Fireworks,
          # pre-sharding): an 8000-line diff rendered a ~110k-TOKEN reviewer prompt, and
          # prefill of that on serverless gpt-oss-120b took 60-158s per call with 2.5x
          # load-dependent VARIANCE. The tail exceeds Bun 1.3.11's hard 300s fetch ceiling,
          # which the engine turns into a fatal run (tracked upstream in nitpick-flow).
          # max_tokens does NOT help — completions are only ~2.3k tokens; the time is PREFILL,
          # which scales with prompt size. Those numbers are why the shard packer keeps
          # slices small: per-call prefill stays off the ceiling by construction.
          # diff-valve:begin — sliced verbatim by nitpick-flow's .github/scripts/diff-valve.test.mjs, which
          # runs this exact `node -e` invocation against a fixture diff.patch on disk. Keep the
          # region self-contained (diff.patch in the cwd is all it touches); move the markers
          # if that changes.
          node -e '
            const fs = require("fs");
            const BUDGET = 60000; // SAFETY VALVE only — sharded fan-out owns sizing (classify shard plan); guards pathological >60k-line diffs
            const raw = fs.readFileSync("diff.patch", "utf8").split("\n");
            if (raw.length <= BUDGET) process.exit(0);
            const files = [];
            let cur = null;
            for (const line of raw) {
              const m = line.match(/^diff --git a\/(.+) b\//);
              if (m) { cur = { name: m[1], lines: [] }; files.push(cur); }
              if (cur) cur.lines.push(line);
            }
            if (files.length === 0) {
              // No `diff --git` header matched anything — bucketing by file is impossible.
              // Leave the diff untouched rather than silently truncating it to nothing (the
              // old failure mode this valve replaced); the token andon downstream still
              // guards against a blowup.
              console.log("diff valve: found no diff --git headers in " + raw.length + " lines; leaving diff.patch untouched");
              process.exit(0);
            }
            const isTest = (n) => /(^|\/)__tests__\//.test(n) || /\.test\.[jt]sx?$/.test(n) || /(^|\/)tests?\//.test(n);
            files.sort((a, b) => Number(isTest(a.name)) - Number(isTest(b.name)));
            const kept = []; const omitted = [];
            let used = 0;
            for (const f of files) {
              if (used + f.lines.length <= BUDGET) { kept.push(f); used += f.lines.length; }
              else omitted.push(f);
            }
            if (kept.length === 0) {
              // Every file exceeds BUDGET on its own (e.g. one vendored lockfile) — the greedy
              // pack above drops it and the review would see only the manifest below it. Keep
              // one file instead, truncated to the budget with an explicit marker: a partial
              // review with honest coverage beats a dead job (see above). Prefer a non-test
              // file, then the smallest, so the most of the diff survives the cut.
              const pool = omitted.some((f) => !isTest(f.name)) ? omitted.filter((f) => !isTest(f.name)) : omitted;
              const pick = pool.reduce((a, b) => (b.lines.length < a.lines.length ? b : a));
              omitted.splice(omitted.indexOf(pick), 1);
              const cut = pick.lines.slice(0, BUDGET);
              cut.push("@@ TRUNCATED: " + pick.name + " is " + pick.lines.length +
                " diff lines, over the " + BUDGET + "-line budget alone; showing the first " + BUDGET + " @@");
              kept.push({ name: pick.name, lines: cut });
              used = cut.length;
            }
            let out = kept.map((f) => f.lines.join("\n")).join("\n");
            if (omitted.length) {
              out += "\n\n@@ DIFF TRUNCATED FOR REVIEW: " + omitted.length +
                " file(s) omitted to fit the model context (source files were prioritized over tests) @@\n" +
                omitted.map((f) => "@@ omitted: " + f.name + " (" + f.lines.length + " diff lines) @@").join("\n") + "\n";
            }
            fs.writeFileSync("diff.patch", out);
            console.log("diff capped: kept " + kept.length + "/" + files.length + " files, " + used + "/" + raw.length + " lines");
          '
          # diff-valve:end
          # Consumer listed-only globs (.nitpickignore, gitignore syntax; README "Excluding files
          # from review"). Read from the PR's BASE commit, not the checkout: the checkout is the
          # PR's own merge ref, and a PR that could edit the file it is judged by could list its
          # own code out of review. A PR that changes .nitpickignore therefore takes effect after
          # merge, and the change itself is reviewed like any other file. Copied into the flow as
          # /flow/.nitpickignore in the run step, where classify.mjs reads it by convention.
          #
          # A 404 (absent on the base branch) means built-in rules only, with no message: most
          # repos have no .nitpickignore. Any other failure (rate limit, 403, 5xx, network error)
          # also falls back to built-in rules, but prints a ::warning:: naming the error, because
          # the repo's exclusions were skipped. Any failure removes the partial file. Never fails
          # the step.
          NITPICKIGNORE_URL="repos/${{ github.repository }}/contents/.nitpickignore?ref=${{ github.event.pull_request.base.sha }}"
          # nitpickignore-fetch:begin. nitpick-flow's .github/scripts/retry-gate.test.mjs runs this region
          # verbatim under `bash -e` with a stubbed `gh` on PATH and NITPICKIGNORE_URL set, so
          # keep it self-contained.
          if gh api "$NITPICKIGNORE_URL" -H "Accept: application/vnd.github.raw" \
              > nitpickignore.base 2>nitpickignore.err; then
            rm -f nitpickignore.err
          else
            rm -f nitpickignore.base
            if grep -qE 'HTTP 404|Not Found' nitpickignore.err; then
              : # absent on the base branch; built-in rules only, nothing to report
            else
              # gh's stderr can span multiple lines. A raw CR or LF inside a ::warning::
              # annotation ends the directive at that line, and whatever follows prints as
              # plain log output, so collapse line breaks to spaces before truncating.
              echo "::warning::could not read this repo's .nitpickignore ($(tr '\r\n' '  ' < nitpickignore.err | head -c 200)); this run uses built-in rules only"
            fi
            rm -f nitpickignore.err
          fi
          # nitpickignore-fetch:end
          # Shared context: project conventions the reviewers respect.
          { [ -f CLAUDE.md ] && cat CLAUDE.md; \
            find . -maxdepth 3 -name AGENTS.md -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \; ; } \
            > context.txt 2>/dev/null || true
          node -e 'const fs=require("fs");fs.writeFileSync("context.json",JSON.stringify({context:fs.existsSync("context.txt")?fs.readFileSync("context.txt","utf8"):""}))'

      - name: Log in to GHCR
        # Needed only if the engine/flow image is private. Public images skip auth fine; this is
        # harmless when the token can't see the package — the later pull just falls back to anon.
        # MUST run before any step that pulls FLOW_IMAGE (e.g. the spider step below) — a private
        # image pulled anonymously fails, and continue-on-error on that step would hide it, silently
        # degrading the coupling graph to diff-derived edges on every run.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Spider the checkout (coupling graph + related-code pack)
        # Deterministic, ~50ms, zero tokens. Two outputs, both by convention:
        #   graph.json  — coupling graph; classify.mjs shards on it. Without it sharding falls
        #                 back to diff-derived edges (lossier, still coupling-aware).
        #   related.txt — the reviewers' RELATED CODE section: ~850 tokens of excerpts from
        #                 UNCHANGED files the diff reaches (a helper it imports, the prisma
        #                 models it touches, the API spec beside a changed route). Contract-class
        #                 bugs live in those files, and reviewers otherwise never see them.
        # This MUST happen here, not in the flow container: the container gets no checkout, only
        # the files we docker cp in. Fallback on any failure is an empty pack — review still runs,
        # just without the extra context.
        # Runs after GHCR login so a private FLOW_IMAGE pulls authenticated, not anonymous.
        run: |
          # World-writable scratch dir: the image runs as its non-root `conduit` user, whose uid
          # does not match the runner's, so a plain bind-mounted dir is EACCES on first write.
          mkdir -p .spider-out && chmod 777 .spider-out
          # --entrypoint bun is REQUIRED: the engine image's ENTRYPOINT is ["bun","src/cli/main.ts"],
          # so a bare trailing command APPENDS to it instead of replacing it, and the workdir
          # override then breaks the entrypoint's relative path ("Module not found src/cli/main.ts").
          # Same pattern as the report-*/post-review steps. Latent since the step was written —
          # only exposed once the FLOW_IMAGE env fix let this docker run execute at all.
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/.spider-out:/out" \
            -v "$PWD/diff.patch:/tmp/diff.patch:ro" --entrypoint bun "$FLOW_IMAGE" \
            /flow/src/spider.mjs /repo /out/graph.json --diff /tmp/diff.patch --pack /out/related.txt \
            && mv .spider-out/graph.json graph.json \
            && mv .spider-out/related.txt related.txt \
            || echo "spider unavailable — classify falls back to diff-derived edges, reviewers to an empty pack"
        continue-on-error: true

      - name: Run Nitpick flow
        env:
          REVIEWER_MODEL: accounts/fireworks/models/glm-5p3-flash
          COORDINATOR_MODEL: accounts/fireworks/models/glm-5p3-flash
          CONDUIT_BASE_URL: https://api.fireworks.ai/inference/v1
          CONDUIT_API_KEY: ${{ secrets.FIREWORKS_AI_API_KEY }}
        run: |
          set -euo pipefail
          # The review stations render related.txt unconditionally, so the file must exist even
          # when the spider step above failed (it is continue-on-error). An empty pack is benign:
          # the reviewers just get no RELATED CODE section.
          [ -f related.txt ] || printf '(no related code identified)\n' > related.txt
          # The per-flow image bakes flow.yaml/src/prompts at /flow (CONDUIT_PROJECT_ROOT=/flow).
          # We need the PR diff IN and review.json OUT without shadowing that baked /flow, so we
          # use the create → cp-in → start → cp-out → rm pattern (no project-root bind-mount).
          # Render the model names once. Conduit does NOT interpolate ${...} in flow.yaml —
          # we substitute them ourselves. (envsubst is restricted to our two vars so nothing
          # else expands.) A throwaway container donates the baked copy.
          cid=$(docker create "$FLOW_IMAGE" run /flow/flow.yaml)
          docker cp "$cid:/flow/flow.yaml" flow.baked.yaml
          docker rm "$cid" >/dev/null
          envsubst '$REVIEWER_MODEL $COORDINATOR_MODEL' < flow.baked.yaml > flow.rendered.yaml

          # Whole-run retry: a single stalled gateway call is FATAL to a conduit run today
          # (tracked upstream in nitpick-flow: the engine retries 429/5xx but a stall that
          # trips Bun's hard 300s fetch ceiling propagates as `fatal:`). Measured on a
          # large PR: a stall costs ~$0.02-0.04 of discarded work, so re-running the
          # whole flow is cheap insurance. Fresh state volume per attempt — re-entering run
          # `default` on a used volume trips the engine's same-run-id UNIQUE constraint.
          # Drop this loop when the engine retries on stall.
          # retry-loop:begin — sliced verbatim by nitpick-flow's .github/scripts/retry-gate.test.mjs,
          # which runs this exact text under `bash -euo pipefail` with a stubbed `docker`.
          # Keep the region self-contained: everything it needs must be created inside it
          # or stubbed by the test. Move the markers if the loop's boundaries change.
          rc=1
          for attempt in 1 2 3; do
            # A halt file is only ever this attempt's: a stale one would stop the retries below.
            # Same for the advisory: a stale one would be posted for a run that did not write it.
            rm -f plan-halt.json plan-advisory.json
            docker volume rm -f conduit_data >/dev/null 2>&1 || true
            docker volume create conduit_data >/dev/null
            cid=$(docker create \
              -v conduit_data:/data \
              -e CONDUIT_API_KEY -e CONDUIT_BASE_URL \
              "$FLOW_IMAGE" run /flow/flow.yaml --input /tmp/diff.patch)
            docker cp flow.rendered.yaml "$cid:/flow/flow.yaml"
            # The diff goes in at /tmp, NOT /flow: `docker cp` creates container files owned
            # by root, and `conduit run --input` re-writes the input as the entry artifact
            # into the project root — overwriting a root-owned /flow/diff.patch as the
            # non-root `conduit` user is an EACCES. Fed from /tmp, the engine creates
            # /flow/diff.patch itself with the right ownership. (context.json and the
            # rendered flow.yaml are only ever read, so root-owned 644 copies are fine.)
            docker cp diff.patch  "$cid:/tmp/diff.patch"
            docker cp context.json "$cid:/flow/context.json"
            docker cp related.txt  "$cid:/flow/related.txt"
            [ -f graph.json ] && docker cp graph.json "$cid:/flow/graph.json" || true
            [ -f nitpickignore.base ] && docker cp nitpickignore.base "$cid:/flow/.nitpickignore" || true

            # Run to a terminal lane. A real failure (scrap/hold, doctor preflight) exits
            # non-zero.
            # Tee the engine's output so the retry decision below can read it. stderr is
            # folded into stdout on purpose: the andon line is written with io.err and we
            # want it in the Action log inline anyway.
            # THIS STEP SETS `set -euo pipefail` (top of the script) — unlike the post-mortem
            # and spend steps, which run in the default shell. So: (a) the pipeline's status
            # is already docker's, not tee's, and PIPESTATUS is unnecessary; (b) a bare
            # failing pipeline would abort the whole step under `set -e`, skipping the retry
            # loop, the andon gate below, and the container/volume cleanup. The `|| rc=$?`
            # is what makes the failure recoverable — do not "simplify" it away.
            rc=0; docker start -a "$cid" 2>&1 | tee run-attempt.log || rc=$?
            docker cp "$cid:/flow/review.json" review.json 2>/dev/null || true
            docker cp "$cid:/flow/plan-halt.json" plan-halt.json 2>/dev/null || true
            docker cp "$cid:/flow/plan-advisory.json" plan-advisory.json 2>/dev/null || true
            docker rm "$cid" >/dev/null
            [ "$rc" -eq 0 ] && break

            # PLAN-TIME HALT: classify projected the run over budgets.run.max_tokens (the 4M
            # runaway guard), or found nothing reviewable, wrote plan-halt.json and stopped the
            # run before any model call (src/plan-halt.mjs). Same reasoning as the token andon
            # below: the projection is a pure function of the diff, so a retry halts
            # identically. The "Report plan-time halt" step turns the file into a PR comment.
            # Checked on the FILE, not the log line, so reviewed content quoting the message
            # cannot fake it. A plan-advisory.json never reaches here: classify exits 0 with it.
            if [ -f plan-halt.json ]; then
              echo "::warning::Nitpick stopped at plan time, before any model call. Deterministic, not retrying." \
                   "Attempt $attempt of 3. The PR comment has the composition table and what to change."
              break
            fi

            # The CONSUMPTION andon is deterministic — do not retry it.
            #
            # This loop exists for STALLS (see the comment above): a stalled gateway call is
            # transient, so a fresh run is cheap insurance. A run halted for spending its
            # token budget is the opposite. The flow is a pure function of the diff, so
            # attempt 2 packs the same shards, sends the same prompts, and trips the same
            # andon at the same point — three times the spend for one deterministic result.
            # Measured on a real oversized PR: ~1.7M input tokens per attempt,
            # ~5M for the run, zero review posted.
            #
            # Matching the engine's own halt line (conduit control/watchdog.ts emits
            # `andon: run halted — <reason> budget exceeded`, reason `tokens`). Only the
            # token reason is treated as terminal: a `wall_clock` trip is often ONE stalled
            # call eating the window, which is exactly what a retry is for.
            #
            # Match the FULL halt line, fixed-string, not a bare substring. run-attempt.log
            # is the engine's stdout+stderr for a run whose subject is the PR diff, so a
            # loose 'tokens budget exceeded' can be matched by reviewed content that merely
            # quotes the phrase (nitpick-flow's flow.yaml and this file both contain it) —
            # which would silently convert a transient stall into "terminal, don't retry".
            # If the watchdog rewords its halt line this stops firing and we regress to
            # retrying a deterministic andon, so both the string and the loop's exit
            # behaviour are pinned by nitpick-flow's .github/scripts/retry-gate.test.mjs — update together.
            if grep -qF 'andon: run halted — tokens budget exceeded' run-attempt.log; then
              # Backstop only: the plan-time check above should have stopped this run before
              # any spend. Reaching here means its projection came in under the budget and the
              # run did not (see src/plan-halt.mjs for which allowances are estimates).
              echo "::warning::Nitpick halted on the run token budget — deterministic, not retrying." \
                   "Attempt $attempt of 3. The PR is larger than the flow's reviewer budget:" \
                   "split it, or raise budgets.run.max_tokens with the shard/fan-out sizing it implies." \
                   "The plan-time projection was under budget for this run; it under-estimated."
              break
            fi
            echo "conduit run attempt $attempt failed (exit $rc); retrying with a fresh state volume"
          done
          # A PR whose every file is listed only (evidence, data, .nitpickignore) has nothing to
          # review. That is a successful outcome, not a failure: the halt comment says so and the
          # job passes. An over-budget halt keeps the non-zero exit, since no review was posted.
          # The regex accepts any whitespace around the colon, so compact or pretty-printed JSON
          # from classify.mjs both match; nitpick-flow's retry-gate.test.mjs pins it against planHalt's real
          # output. Checked on the file, not the log, for the same reason as the halt check above.
          if [ -f plan-halt.json ] && grep -Eq '"halt"[[:space:]]*:[[:space:]]*"nothing-reviewable"' plan-halt.json; then
            echo "Nitpick: every changed file is listed only; nothing to review."
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            # Post review only runs when this step succeeds, and "Report plan-time advisory"
            # only runs after Post review. So a run that wrote plan-advisory.json (DEGRADED or
            # a large plan) and then failed drops that advisory with no trace unless we say so
            # here, before the step exits.
            if [ -f plan-advisory.json ]; then
              # jq reads the top-level "message" field directly, so a nested object with its
              # own message key cannot be mistaken for it. Collapse line breaks and cap the
              # length before it goes into a ::warning:: annotation, same as the nitpickignore
              # warning above.
              message=$(jq -r '.message // empty' plan-advisory.json 2>/dev/null | tr '\r\n' '  ' | head -c 200) || true
              echo "::warning::Nitpick plan advisory was not posted: the run failed, so Post review and the advisory comment were both skipped. ${message:-plan-advisory.json had a DEGRADED or large-plan advisory.}"
            fi
            echo "conduit run failed (exit $rc)"; exit "$rc"
          fi
          # retry-loop:end
          test -f review.json || { echo "no review.json produced"; exit 1; }

      - name: Explain run failure
        # `conduit run` is silent between doctor preflight and exit — on a scrap the
        # Action log shows nothing but "exit 1". The journal on the conduit_data volume
        # has the whole story (lane transitions, terminal reasons, gate verdicts, one
        # span per model call); report-failure.mjs prints it as a post-mortem. Failure
        # runs only; same never-fail contract as the spend step below. The exit code is
        # captured explicitly (default shell has no pipefail — a `docker | tee || true`
        # pipeline would swallow docker's failure silently); a reporting failure emits a
        # visible ::warning:: annotation instead of failing the job.
        if: failure()
        run: |
          rc=0; out=$(docker run --rm -v conduit_data:/data \
            --entrypoint bun "$FLOW_IMAGE" /flow/report-failure.mjs) || rc=$?
          if [ "$rc" -eq 0 ]; then printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "::warning::Nitpick run post-mortem unavailable (docker exit $rc)"; fi

      - name: Report model spend
        # Best-effort spend report for THIS run, written to the job summary. The engine
        # journals per-call usage (model, tokens, cost) to /data — a named volume, so it
        # outlives the run container's `docker rm`. A second container on the same volume
        # queries it; report-cost.mjs never exits non-zero, and the trailing `|| true`
        # covers docker itself failing (e.g. image pull failed) so reporting can never
        # fail the job. `if: always()` keeps spend visible on failed runs — that's when
        # runaway spend happens. Note: cost is computed tokens × price table unless a
        # LiteLLM gateway reports real per-call cost (Fireworks direct does not). Exit
        # code captured explicitly (no pipefail in the default shell) so a docker
        # failure surfaces as a ::warning:: annotation instead of vanishing.
        if: always()
        run: |
          rc=0; out=$(docker run --rm -v conduit_data:/data \
            --entrypoint bun "$FLOW_IMAGE" /flow/report-cost.mjs) || rc=$?
          if [ "$rc" -eq 0 ]; then printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "::warning::Nitpick spend report unavailable (docker exit $rc)"; fi

      - name: Report plan-time halt
        # classify stopped the run before any model call and left plan-halt.json (copied out in
        # the run step): the projected spend was over budgets.run.max_tokens (4M), or every changed
        # file is listed only. report-halt.mjs posts the composition table and what to change
        # as ONE PR comment, edited in place on later pushes, and echoes it to the job summary.
        # It never fails the job; the run step already decided pass (nothing to review) or
        # fail (over budget). `always()` because the over-budget case fails the run step.
        if: always() && hashFiles('plan-halt.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rc=0; out=$(docker run --rm \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e PR_NUMBER \
            -e HALT_FILE=/plan-halt.json \
            -v "$PWD/plan-halt.json":/plan-halt.json:ro \
            --entrypoint bun "$FLOW_IMAGE" /flow/report-halt.mjs) || rc=$?
          if [ "$rc" -eq 0 ]; then printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "::warning::Nitpick halt comment unavailable (docker exit $rc)"; fi

      - name: Post review
        id: post_review
        # Skipped after a plan-time halt: there is no review.json, and the halt comment above
        # is what the PR gets instead. An advisory (plan-advisory.json) does not skip it.
        if: success() && hashFiles('plan-halt.json') == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # post-review.mjs is baked into the image (/flow/post-review.mjs); run it via the
          # engine's Bun so the workflow needs no checkout of nitpick-flow's own source.
          docker run --rm \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e PR_NUMBER -e HEAD_SHA \
            -e REVIEW_FILE=/review.json \
            -v "$PWD/review.json":/review.json:ro \
            --entrypoint bun \
            "$FLOW_IMAGE" /flow/post-review.mjs
        # A blocking verdict exits non-zero here; mark this job a required check to gate merge.

      - name: Report plan-time advisory
        # classify found the plan DEGRADED (reviewer calls merged past the shard token budget
        # by the fan_out cap, or a single file larger than it) or projected over 1.5M tokens,
        # wrote plan-advisory.json and let the run go on (src/plan-halt.mjs). report-halt.mjs
        # posts it as ONE PR comment under its own marker, edited in place on later pushes and
        # separate from any halt comment: the review ran, N calls ran at up to Mx the gated
        # size so recall there is reduced, plus the composition table and .nitpickignore lines.
        # After Post review, and only when Post review ran: then the comment's "the review ran"
        # is true, and nothing here can skip Post review. Post review exits non-zero on a
        # blocking verdict, which is still a posted review, so this keys on the step having run
        # rather than on success(). It never fails the job: continue-on-error, and
        # report-halt.mjs itself always exits 0.
        if: >-
          !cancelled() && hashFiles('plan-advisory.json') != '' &&
          (steps.post_review.outcome == 'success' || steps.post_review.outcome == 'failure')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rc=0; out=$(docker run --rm \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e PR_NUMBER \
            -e HALT_FILE=/plan-advisory.json \
            -v "$PWD/plan-advisory.json":/plan-advisory.json:ro \
            --entrypoint bun "$FLOW_IMAGE" /flow/report-halt.mjs) || rc=$?
          if [ "$rc" -eq 0 ]; then printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "::warning::Nitpick plan advisory comment unavailable (docker exit $rc)"; fi
